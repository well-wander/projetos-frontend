<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon — Orientação a Objetos</title>
    <style>
        /* cores tiradas da ilustração */
        :root {
            --azul: #2a1a9c;
            --laranja: #f28c50;
            --fundo: #ffffff;
        }

        body {
            font-family: system-ui, sans-serif;
            max-width: 720px;
            margin: 40px auto;
            padding: 0 16px;
            background: var(--fundo);
            color: var(--azul);
        }

        img {
            display: block;
            width: 100%;
            height: auto;
        }

        h1 {
            text-align: center;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin-bottom: 16px;
            padding: 12px 16px;
            border-left: 4px solid var(--laranja);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <img src="img/evolucao-charmander.jpg" alt="Ilustração da linha evolutiva: Charmander, Charmeleon e Charizard, lado a lado, do menor para o maior" width="1200" height="549">

    <h1>Linha evolutiva do Charmander</h1>
    <p>Abra o console (F12) para ver a saída também por lá.</p>

    <ul id="pokemons"></ul>

    <script src="main.js"></script>
</body>
</html>
